# Nginx đứng trước Node (server/start.mjs). Sao chép vào /etc/nginx/sites-available/anduong và sửa tên miền.
# Node chạy với: TRUST_PROXY=1  (nếu có thêm Cloudflare phía trước: TRUST_PROXY=2 hoặc CLIENT_IP_HEADER=cf-connecting-ip)

upstream school_node {
    server 127.0.0.1:5173;
    keepalive 64;
}

# Giới hạn tốc độ API theo IP thật (WebSocket có giới hạn riêng trong Node)
limit_req_zone $binary_remote_addr zone=school_api:10m rate=20r/s;

server {
    listen 443 ssl http2;
    server_name anduong.example.vn;
    # ssl_certificate / ssl_certificate_key: dùng certbot

    client_max_body_size 64k;

    # --- WebSocket: phải có Upgrade/Connection, timeout dài hơn chu kỳ ping 20 s của server ---
    location /multiplayer {
        proxy_pass http://school_node;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;
        proxy_buffering off;          # gói vị trí đi thẳng, không gom trong proxy
    }

    # --- Tải nhạc lên (trang quản lý): cho phép file lớn, không đệm vào RAM ---
    location = /api/admin/music {
        client_max_body_size 45m;
        proxy_request_buffering off;
        proxy_pass http://school_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }

    # --- API: không cache, có giới hạn tốc độ ---
    location /api/ {
        limit_req zone=school_api burst=40 nodelay;
        proxy_pass http://school_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        add_header Cache-Control "no-store" always;
    }

    # --- Giám sát: chỉ cho mạng nội bộ / máy giám sát ---
    location = /metrics {
        allow 127.0.0.1;
        # allow <IP máy Prometheus/Grafana>;
        deny all;
        proxy_pass http://school_node;
    }

    # --- File tĩnh: Node đã đặt Cache-Control/ETag/nén; Nginx chỉ chuyển tiếp (CDN sẽ cache) ---
    location / {
        proxy_pass http://school_node;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name anduong.example.vn;
    return 301 https://$host$request_uri;
}
